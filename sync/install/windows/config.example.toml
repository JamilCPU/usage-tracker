# usage-sync configuration: %LOCALAPPDATA%\usage-sync\config.toml
# Created by install.ps1 (usage-sync init). Single-quoted TOML strings keep backslashes literal.
device = "<device-name>"
ingest_url = "https://ingest.example"
# ca_file = 'C:\Users\<user>\lab-tls\lab-ca.pem'   # lab CA, if the ingest certificate is lab-signed
# ingest_connect_host = "<ip-or-host>[:port]"   # connect here instead of resolving the ingest host (https only; TLS still verifies the ingest_url host)
# aw_url = "http://127.0.0.1:5600"
# interval_seconds = 60
# batch_size = 1000
# settle_seconds = 120
# overlap_seconds = 3600
# token_file = 'C:\Users\<user>\AppData\Local\usage-sync\token'   # default: next to this file
# idle_apps = ["myscreensaver.exe"]   # ADDED to the built-in lock-screen apps (lockapp.exe, logonui.exe, ...)
# idle_apps_replace = false          # true: use only the idle_apps listed here, drop the built-ins
# redact_apps = ["..."]      # defaults are built in
# redact_domains = ["..."]
# redact_title_markers = ["private browsing", "inprivate", "incognito", "private window"]   # window titles containing these are blanked (so are titles containing a redact_domains entry)
