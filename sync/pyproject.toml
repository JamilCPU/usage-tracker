[project]
name = "usage-sync"
version = "0.1.0"
description = "Reads local ActivityWatch events and ships them to the Lab Data Store ingest API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
usage-sync = "usage_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
