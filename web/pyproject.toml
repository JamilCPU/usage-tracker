[project]
name = "usage-web"
version = "0.1.0"
description = "Viewer for usage data in the Lab Data Store"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings",
  "httpx",
  "itsdangerous",
  "jinja2",
]

[project.scripts]
usage-web = "usage_web.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_web"]
artifacts = ["src/usage_web/static"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a Postgres+TimescaleDB admin DSN (TEST_ADMIN_DSN)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
