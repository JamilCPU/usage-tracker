name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('sync/pyproject.toml') != ''
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv sync --locked
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv run ruff check .
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('web/pyproject.toml') != ''
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv sync --locked
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv run ruff check .
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv run pytest -q
        env:
          TEST_ADMIN_DSN: postgresql://postgres:ci@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  image-check:
    if: github.event_name == 'pull_request'
    needs: [web, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: usage-web:pr-${{ github.event.pull_request.number }}
      - name: Smoke-test the image
        run: |
          IMG=usage-web:pr-${{ github.event.pull_request.number }}
          docker run --rm "$IMG" usage-web --help
          docker run --rm "$IMG" test -f /app/.venv/lib/python3.12/site-packages/usage_web/static/index.html

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jamilcpu/usage-web:${{ github.sha }}
            ghcr.io/jamilcpu/usage-web:latest

