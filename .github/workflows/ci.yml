name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('sync/pyproject.toml') != ''
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv sync --locked
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv run ruff check .
      - if: hashFiles('sync/pyproject.toml') != ''
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('web/pyproject.toml') != ''
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv sync --locked
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv run ruff check .
      - if: hashFiles('web/pyproject.toml') != ''
        run: uv run pytest -q

